name: football-app-test

services:
  postgres-test:
    # pgvector/pgvector:pg15 — xem comment tương tự ở docker-compose.yml's postgres service.
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: football_app_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data # ephemeral — không cần persist giữa các lần chạy test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/football_app_test?schema=public
    depends_on:
      postgres-test:
        condition: service_healthy
    # `db push` build schema fresh từ schema.prisma, KHÔNG replay migration history — nên
    # `CREATE EXTENSION vector` (không biểu diễn được qua schema.prisma DSL, xem migration
    # add_pgvector_embedding_column) không tự chạy, cột `embedding vector(768)` sẽ lỗi "type vector
    # does not exist" nếu thiếu bước bootstrap này trước `db push`.
    command: >
      sh -c "echo 'CREATE EXTENSION IF NOT EXISTS vector;' |
      pnpm --filter @football-app/database exec prisma db execute --schema prisma/schema.prisma --stdin &&
      pnpm --filter @football-app/database exec prisma db push --skip-generate &&
      pnpm test"
